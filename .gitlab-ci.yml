stages:
  - build
  - test

build:docker-ci:
  stage: build
  when: manual
  image: docker:stable
  tags:
    - linux
    - large
  rules:
    - changes:
        - docker/ci.dockerfile
      when: always
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build . -t "$CI_REGISTRY_IMAGE/pesto-ci" -f docker/ci.dockerfile
    - docker push "$CI_REGISTRY_IMAGE/pesto-ci"

build:pesto:
  stage: build
  script:
    - mkdir build
    - cd build
    - cmake .. && cmake --build .

.test:
  stage: test
  variables:
    GIT_STRATEGY: FETCH
  tags:
    - linux
  image: "$CI_REGISTRY_IMAGE/pesto-ci"

test:polybench:
  extends: .test
  tags:
    - large
  script:
    - cd build
    - cmake --build .  --target test-polybench
