spec:
  inputs:
    docker_image:
      options: ["debian.dockerfile", "alpine.dockerfile"]
      description: "Docker image to use for building and testing"
      default: "debian.dockerfile"
---
stages:
  - build
  - test
workflow:
  rules:
    # MR to main → normal CI
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    # scheduled pipelines → allowed
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # optional: manual runs
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

build:pesto:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - ci.inria.fr
    - large
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - sh ./docker/build_and_push.sh $[[ inputs.docker_image ]]
  artifacts:
    paths:
      - .gitlab-ci-docker-image
    expire_in: 5 hour

.test:
  stage: test
  tags:
    - ci.inria.fr
    - large
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - build:pesto
  before_script:
    - |
      echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
      export DOCKER_IMAGE=$(cat .gitlab-ci-docker-image)
      docker pull $DOCKER_IMAGE
test:workflow:
  extends: .test
  script:
    - |
      docker run --rm "$DOCKER_IMAGE" cmake --build build/ --target check-workflow
test:polybench:algebraic:
  extends: .test
  script:
    - |
      docker run --rm "$DOCKER_IMAGE" cmake --build build/ --target test-polybench-algebraic
test:polybench:hybrid:
  extends: .test
  script:
    - |
      docker run --rm "$DOCKER_IMAGE" cmake --build build/ --target test-polybench-hybrid
test:polybench:dynschedule:
  extends: .test
  script:
    - |
      docker run --rm "$DOCKER_IMAGE" cmake --build build/ --target test-polybench-dynschedule
test:polybench:tpz:
  extends: .test
  script:
    - |
      docker run --rm "$DOCKER_IMAGE" cmake --build build/ --target test-polybench-tpz

