stages:
  - build
  - test

build:docker-ci:
  stage: build
  when: manual
  image: docker:stable
  tags:
    - ci.inria.fr
    - large
  rules:
    - changes:
        - docker/ci.dockerfile
      when: always
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build . -t "$CI_REGISTRY_IMAGE/pesto-ci" -f docker/ci.dockerfile
    - docker push "$CI_REGISTRY_IMAGE/pesto-ci"

build:pesto:
  stage: build
  image: $CI_REGISTRY_IMAGE/pesto-ci
  tags:
    - ci.inria.fr
    - large
  script:
    - mkdir build
    - cd build
    - cmake .. -DPESTO_BUILD_JOBS=4 && cmake --build . -j
  artifacts:
    paths:
      - build
    expire_in: 1 day

.test:
  stage: test
  variables:
    GIT_STRATEGY: FETCH
  tags:
    - ci.inria.fr
  image: $CI_REGISTRY_IMAGE/pesto-ci

test:polybench:
  extends: .test
  tags:
    - large
  script:
    - cd build
    - cmake --build .  --target test-polybench -j
