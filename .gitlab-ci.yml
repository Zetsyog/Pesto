stages:
  - build
  - test

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

workflow:
  rules:
    # MR to main → normal CI
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    # scheduled pipelines → allowed
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # optional: manual runs
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

build:pesto:
  stage: build
  image: docker:dind
  tags:
    - ci.inria.fr
    - large
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$IMAGE_TAG" -f ./docker/debian.dockerfile .
    - docker push "$IMAGE_TAG"
.test:
  stage: test
  tags:
    - ci.inria.fr
  image: $IMAGE_TAG
test:polybench:algebraic:
  extends: .test
  script:
    - cd /pesto/build
    - cmake --build . --target test-polybench-algebraic
    - cmake --build . --target test-polybench-hybrid
test:polybench:dynschedule:
  extends: .test
  script:
    - cd /pesto/build
    - cmake --build . --target test-polybench-dynschedule
test:polybench:tpz:
  extends: .test
  script:
    - cd /pesto/build
    - cmake --build . --target test-polybench-tpz

