stages:
  - build
  - test

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"


build:pesto:
  stage: build
  image: docker:dind
  tags:
    - ci.inria.fr
    - large
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" -f ./docker/debian.dockerfile .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
.test:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never
  tags:
    - ci.inria.fr
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

test:polybench:
  extends: .test
  tags:
    - large
  script:
    - cd /pesto/build
    - cmake --build . --target test-polybench

