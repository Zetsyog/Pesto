stages:
  - build
  - test

build-docker-ci:
  stage: build
  when: manual
  image: docker:stable
  tags:
    - ci.inria.fr
    - large
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build . -t "$CI_REGISTRY_IMAGE/pesto-ci" -f docker/ci.dockerfile
    - docker push "$CI_REGISTRY_IMAGE/pesto-ci"

.build-pesto:
  stage: build
  script:
    - mkdir build
    - cd build
    - cmake .. && cmake --build .

.test:
  stage: test
  variables:
    GIT_STRATEGY: FETCH
  tags:
    - ci.inria.fr
  image: "$CI_REGISTRY_IMAGE/pesto-ci"
  before_script:
    - mkdir -p build
    - cd build
    - cmake ..

.test-polybench:
  extends: .test
  tags:
    - ci.inria.fr
    - large
  script:
    - cmake --build .  --target test-polybench
